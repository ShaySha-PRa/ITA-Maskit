name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        # gui + pdf：GUI 子进程测试需要 PyQt5；PDF beta 测试需要 pymupdf
        run: pip install -e ".[dev,gui,pdf]"
      - name: Lint (ruff)
        run: ruff check maskit/ tests/
      - name: Test (pytest)
        run: pytest tests/ --native-mode=python -q

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev python3-dev
      - name: Install Python deps
        run: pip install -e ".[dev]" pybind11
      - name: Build native core
        run: bash scripts/build_native.sh
      - name: Differential tests
        run: pytest tests/test_native_parity.py --native-mode=compare -q
      - name: Kernel smoke
        run: python scripts/bench_native_kernel.py

  # 每个 push 自动构建 Windows exe，供用户直接下载（无需自己打包）
  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[gui,image,llm,pdf]"
          pip install pyinstaller
      - name: Build exe
        run: python -m PyInstaller ITA-Maskit.spec --clean --noconfirm
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITA-Maskit-exe
          path: dist/ITA-Maskit.exe
          if-no-files-found: error
