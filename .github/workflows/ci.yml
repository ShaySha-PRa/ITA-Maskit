name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        # gui + pdf：GUI 子进程测试需要 PyQt5；PDF beta 测试需要 pymupdf
        run: pip install -e ".[dev,gui,pdf]"
      - name: Lint (ruff)
        run: ruff check maskit/ tests/
      - name: Test (pytest)
        run: pytest tests/ --native-mode=python -q

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev python3-dev
      - name: Install Python deps
        run: pip install -e ".[dev]" pybind11
      - name: Build native core
        run: bash scripts/build_native.sh
      - name: Differential tests
        run: pytest tests/test_native_parity.py --native-mode=compare -q
      - name: Kernel smoke
        run: python scripts/bench_native_kernel.py

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - name: Install Python deps
        run: pip install -e ".[dev]" pybind11
      - name: Build native core
        run: powershell -ExecutionPolicy Bypass -File scripts/build_native.ps1
      - name: Native parity smoke
        run: powershell -ExecutionPolicy Bypass -File scripts/test_native.ps1

  # 每个 push 分别构建 Python / Native 两个 Windows exe，用户按需下载
  build-exe:
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: python
            exe_name: ITA-Maskit
            artifact: ITA-Maskit-exe
          - variant: native
            exe_name: ITA-Maskit-native
            artifact: ITA-Maskit-native-exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.variant == 'native'
      - uses: lukka/get-cmake@latest
        if: matrix.variant == 'native'
      - name: Install dependencies
        run: |
          pip install -e ".[gui,image,llm,pdf]"
          pip install pyinstaller
      - name: Build native core
        if: matrix.variant == 'native'
        run: |
          pip install pybind11
          powershell -ExecutionPolicy Bypass -File scripts/build_native.ps1
      - name: Build exe
        env:
          MASKIT_EXE_NAME: ${{ matrix.exe_name }}
          MASKIT_BUNDLE_NATIVE: ${{ matrix.variant == 'native' && '1' || '0' }}
        run: python -m PyInstaller ITA-Maskit.spec --clean --noconfirm
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe_name }}.exe
          if-no-files-found: error

  # Python exe is the auditor download. Native matrix may fail; still publish
  # the successful Python artifact to a stable Release URL.
  publish-windows-exe:
    if: >
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !cancelled() && needs.build-exe.result != 'skipped'
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python exe
        uses: actions/download-artifact@v4
        with:
          name: ITA-Maskit-exe
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/ITA-Maskit.exe
          notes='审计人员下载 ITA-Maskit.exe 后双击即可运行，无需安装 Python。

          若出现 Windows SmartScreen：更多信息 → 仍要运行。

          一键安装（开始菜单 + 桌面快捷方式）：
          powershell -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/ShaySha-PRa/ITA-Maskit/main/scripts/install_windows.ps1 | iex"

          Native 版仍在 Actions Artifacts（ITA-Maskit-native-exe）。'
          if ! gh release view windows --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create windows --repo "$GITHUB_REPOSITORY" \
              --title "Windows 版（直接下载）" \
              --notes "$notes"
          fi
          gh release upload windows dist/ITA-Maskit.exe --repo "$GITHUB_REPOSITORY" --clobber

