[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ita-maskit"
version = "0.5.0"
description = "ITA data masking CLI — 高性能数据脱敏工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ShaySha-PRa" }]
keywords = ["masking", "data-anonymization", "pseudonymization", "audit", "polars"]
dependencies = [
    "polars>=0.20",
    "typer>=0.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.0",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "extract-msg>=0.50",
]

[project.optional-dependencies]
# 图片脱敏（beta）：需 --image-crop 启用，另需手动安装 tesseract 二进制 + 中文语言包
image = [
    "pillow>=10.0",
    "pytesseract>=0.3",
]
# LLM 规则生成（可选增强）：maskit rules generate，需配置 MASKIT_LLM_API_KEY
llm = [
    "httpx>=0.24",
]
# Windows 桌面 GUI（PyQt5）：python -m maskit.gui_app
gui = [
    "PyQt5>=5.15",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
maskit = "maskit.cli:app"

[tool.setuptools.packages.find]
include = ["maskit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
